<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Coffee Diary" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div>
          <a href="{{ url_for('coffees') }}" class="logo">Coffee Diary</a>
          <p class="subtitle">A calm space to track your brews.</p>
        </div>
        <nav class="nav">
          <a href="{{ url_for('coffees') }}">Coffees</a>
          <a href="{{ url_for('import_csv') }}">Import</a>
          <a href="{{ url_for('insights') }}">Insights</a>
        </nav>
      </header>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
